# Version-keyed New Features and Enhancements catalog for idm-upgrade-helper.
# Scope: ONLY the "Identity Management" subsection of each per-minor Release Notes
# "New features and enhancements" chapter (non-IdM RHEL features excluded).
#
# MODEL = POINT-IN-TIME per version: each entry is tagged with added_in, the version
# whose release notes announced it. The matcher shows features gained along the chosen
# upgrade path, i.e. added_in in the half-open interval (current, target]. A feature
# that the docs re-announce in a later version (e.g. HSM in both 10.0 and 10.1) is
# listed once per version, mirroring the Red Hat release notes.
#
# Fields: id, component, feature, added_in, src (rn = Release Notes), optional note.
# Verified 2026-10-23 vs docs.redhat.com per-minor Release Notes.
# NOTE: these are version-specific (tagged by added_in), NOT a flat cumulative dump.
# RHEL 10.2 has no IdM "New features and enhancements" section (nil).

# Single section-level release-notes link (one per section, NOT per entry), keyed by
# target MAJOR (slugs/anchors drift across majors). Placeholders: <major>, <version>
# (full target x.y). Only majors with a byte-verified pattern are listed; a target
# whose major is absent here simply prints no link. Verified for RHEL 10.x 2026-10-23.
doc:
  "10": "https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/<major>/html/<version>_release_notes/new-features-and-enhancements#new-features-and-enhancements-identity-management"
  "9": "https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/<major>/html/<version>_release_notes/new-features#new-features-identity-management"
  "9.0": "https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/9.0_release_notes/new-features#enhancement_identity-management"
  "9.1": "https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/9.1_release_notes/new-features#enhancement_identity-management"

new_features:

  # --- RHEL 10.0 -------------------------------------------------
  - {id: nf-jwcrypto-156-100, component: idm, added_in: "10.0", src: rn,
     feature: "python-jwcrypto 1.5.6 (security fix for JWE token decompression DoS)"}
  - {id: nf-ansible-freeipa-1145, component: idm, added_in: "10.0", src: rn,
     feature: "ansible-freeipa 1.14.5 (module_defaults, multi-sudo-rule management, external-member removal fix)"}
  - {id: nf-ipa-idrange-fix, component: idm, added_in: "10.0", src: rn,
     feature: "New ipa-idrange-fix tool to analyze and propose fixes for IdM ID range inconsistencies"}
  - {id: nf-expired-cert-autoremove, component: idm-cert, added_in: "10.0", src: rn,
     feature: "Automated removal of expired certificates is enabled by default (30-day retention on new replicas)"}
  - {id: nf-pyasn1-061, component: idm, added_in: "10.0", src: rn,
     feature: "python-pyasn1 0.6.1 (Python 3.13 support)"}
  - {id: nf-ldap-starttls-default, component: sssd, added_in: "10.0", src: rn,
     feature: "ldap_id_use_start_tls is now enabled by default (prevents MITM on identity lookups)"}
  - {id: nf-certmonger-07920, component: idm-cert, added_in: "10.0", src: rn,
     feature: "certmonger 0.79.20 (token handling and bug fixes)"}
  - {id: nf-kerberos-ecdh-pkinit, component: kerberos, added_in: "10.0", src: rn,
     feature: "Kerberos now supports Elliptic Curve Diffie-Hellman key agreement for PKINIT (pkinit_dh_min_bits P-256/384/521)"}
  - {id: nf-389ds-306, component: 389-ds, added_in: "10.0", src: rn,
     feature: "389-ds-base 3.0.6 (error-log buffering, JSON audit logs, logconv.py)"}
  - {id: nf-389ds-lmdb-full, component: 389-ds, added_in: "10.0", src: rn,
     feature: "389-ds-base now fully supports LMDB (only database type for new instances)"}
  - {id: nf-openldap-268, component: idm, added_in: "10.0", src: rn,
     feature: "openldap 2.6.8 (improved TLS and Kerberos SASL with STARTTLS for ECC certs)"}
  - {id: nf-ds-log-buffering, component: 389-ds, added_in: "10.0", src: rn,
     feature: "Directory Server buffers the error, audit, and audit-fail logs (new buffering settings)"}
  - {id: nf-pbkdf2-iterations, component: 389-ds, added_in: "10.0", src: rn,
     feature: "Configurable hashing iterations for PBKDF2-* password storage schemes (nsslapd-pwdpbkdf2numiterations, default 100000)"}
  - {id: nf-dsctl-substr-index-warn, component: 389-ds, added_in: "10.0", src: rn,
     feature: "dsctl healthcheck now warns about creating a substring index on the membership attribute"}
  - {id: nf-gssproxy-notify, component: idm, added_in: "10.0", src: rn,
     feature: "gssproxy systemd service type changed from forking to notify (bootc compatibility)"}
  - {id: nf-acme-ga-100, component: idm-cert, added_in: "10.0", src: rn,
     feature: "ACME is now fully supported in IdM (90-day certificate validity)"}
  - {id: nf-hsm-ga-100, component: idm-cert, added_in: "10.0", src: rn,
     feature: "HSM is now fully supported in IdM (store CA/KRA key pairs and certificates on a Hardware Security Module)",
     note: "Also re-announced in the 10.1 new-features list (see nf-hsm-ga-101)"}

  # --- RHEL 10.1 -------------------------------------------------
  - {id: nf-healthcheck-cert-expiry, component: idm, added_in: "10.1", src: rn,
     feature: "ipa-healthcheck now warns about expiring HTTP, DS, and PKINIT certificates (28 days ahead)"}
  - {id: nf-ansible-freeipa-1151, component: idm, added_in: "10.1", src: rn,
     feature: "ansible-freeipa rebased to 1.15.1 (compatible with the redhat.rhel_idm collection namespace)"}
  - {id: nf-healthcheck-krblastauth, component: idm, added_in: "10.1", src: rn,
     feature: "Healthcheck warns if krbLastSuccessfulAuth is enabled (possible performance impact)"}
  - {id: nf-uid-max-legacy, component: idm, added_in: "10.1", src: rn,
     feature: "IdM now supports UIDs/GIDs up to the Linux maximum (2^32-1) for legacy-system compatibility (requires disabling subID)"}
  - {id: nf-samba-4224, component: samba, added_in: "10.1", src: rn,
     feature: "samba rebased to 4.22.4 (SMB3 directory leases, TCP-based LDAP/LDAPS DC queries)"}
  - {id: nf-idm-upgrade-helper, component: idm, added_in: "10.1", src: rn,
     feature: "Identity Management Upgrade Helper: a new app providing step-by-step instructions for upgrading an IdM environment to a newer RHEL version"}
  - {id: nf-uniqueness-exclude-subtrees, component: 389-ds, added_in: "10.1", src: rn,
     feature: "Exclude subtrees from attribute uniqueness verification via dsconf or the web console (uniqueness-exclude-subtrees)"}
  - {id: nf-389ds-313, component: 389-ds, added_in: "10.1", src: rn,
     feature: "389-ds-base rebased to 3.1.3 (session tracking, PBKDF2 iterations config, log buffering, CRYPT-YESCRYPT, JSON logs, dsidm fixes)"}
  - {id: nf-uniqueness-matching-rules, component: 389-ds, added_in: "10.1", src: rn,
     feature: "Custom matching rules in the Attribute Uniqueness plugin for searching uniqueness attributes"}
  - {id: nf-389ds-json-logs, component: 389-ds, added_in: "10.1", src: rn,
     feature: "JSON format available for the access and error logs in 389-ds-base"}
  - {id: nf-dsidm-full-dn, component: 389-ds, added_in: "10.1", src: rn,
     feature: "New dsidm list --full-dn option (returns full distinguished names)"}
  - {id: nf-389ds-session-id, component: 389-ds, added_in: "10.1", src: rn,
     feature: "389-ds-base logs now contain a session identifier for bind/modify operations (replication tracing)"}
  - {id: nf-acme-es256, component: idm-cert, added_in: "10.1", src: rn,
     feature: "ACME server adds support for the ES256 signature algorithm (interoperability with clients such as Caddy)"}
  - {id: nf-idm-to-idm-migration-ga, component: idm, added_in: "10.1", src: rn,
     feature: "IdM-to-IdM migration is now fully supported (use ipa-migrate to move IdM-specific data between IdM servers)",
     note: "Graduated from Technology Preview (tp-idm-to-idm-migration, TP in 10.0)"}
  - {id: nf-hsm-ga-101, component: idm-cert, added_in: "10.1", src: rn,
     feature: "HSM is now fully supported in IdM (store CA/KRA key pairs and certificates on a Hardware Security Module)",
     note: "Re-announced from the 10.0 new-features list (see nf-hsm-ga-100); listed in both per the release notes"}

